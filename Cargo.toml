[package]
name        = "pointdexter"
version     = "0.1.0"
edition     = "2021"
description = "Lock-free hierarchical key/value tree with C FFI"
authors     = ["Soumyo Deep Gupta <deep.main.ac@gmail.com>"]
license-file = "LICENSE"
readme      = "README.md"
keywords    = ["tree", "concurrent", "ffi", "lock-free", "key-value"]
categories  = ["data-structures", "concurrency", "api-bindings"]

# ── Output: both a Rust library and a C dynamic library ─────────────────────
[lib]
name  = "pointdexter"
crate-type = ["rlib", "cdylib"]   # rlib for Rust consumers, cdylib for C/C++/Python

# ── Runtime dependencies ─────────────────────────────────────────────────────
[dependencies]
crossbeam-skiplist = "0.1"
dashmap            = "5"
parking_lot        = "0.12"

# ── Optimisation profile (release) ──────────────────────────────────────────
[profile.release]
opt-level       = 3          # full optimisation
lto             = "fat"      # full link-time optimisation across all crates
codegen-units   = 1          # single codegen unit – maximises LTO effectiveness
panic           = "abort"    # no unwinding machinery in the binary
strip           = "symbols"  # strip debug symbols from the final .so
overflow-checks = false      # disable overflow panics (they can't fire with panic=abort anyway)
debug           = false

# ── Security-hardened profile (use with: cargo build --profile hardened) ────
# Builds with full optimisation AND retains DWARF info + overflow checks so
# that sanitisers (ASan / UBSan) and audit tools have something to work with.
[profile.hardened]
inherits        = "release"
debug           = 2          # full DWARF – required for ASan stack traces
strip           = "none"
overflow-checks = true       # catch integer overflows in hardened builds
panic           = "abort"
# Pass RUSTFLAGS="-C target-cpu=native -Z sanitizer=address" for ASan builds

[dev-dependencies]
